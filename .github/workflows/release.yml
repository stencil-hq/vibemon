name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binaries:
    name: Package ${{ matrix.target }} binaries and guest assets
    # vmon CI (docs/src/operate/ci.md). Both targets cross-build on x86_64.
    runs-on: vmon-large
    # The guest assets ship the vmon kernel built by the `kernel` job.
    needs: [kernel]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
            kernel: bzImage-x86_64
          - target: aarch64-unknown-linux-musl
            arch: aarch64
            kernel: Image-aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: ./.github/actions/rust-toolchain

      - name: Add the release target
        run: rustup target add ${{ matrix.target }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Zig linker
        uses: goto-bus-stop/setup-zig@v2

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@cargo-zigbuild

      - name: Install target runtime
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-user

      - name: Package release binaries
        run: ./scripts/package-rust-release.sh --target ${{ matrix.target }}

      - name: Smoke archived CLI and validate archived agent
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          smoke_dir=$(mktemp -d)
          trap 'rm -rf "${smoke_dir}"' EXIT
          (
            cd dist
            sha256sum --check "vmon-${RELEASE_TARGET}.tar.gz.sha256"
          )
          tar -xzf "dist/vmon-${RELEASE_TARGET}.tar.gz" -C "${smoke_dir}"
          ./scripts/release-smoke.sh \
            --target "${RELEASE_TARGET}" \
            --vmon "${smoke_dir}/vmon-${RELEASE_TARGET}/vmon" \
            --agent "${smoke_dir}/vmon-${RELEASE_TARGET}/vmon-agent-${{ matrix.arch }}"

      - name: Download the vmon kernel
        uses: actions/download-artifact@v4
        with:
          name: vmon-kernel-${{ matrix.arch }}
          path: dist/kernel

      - name: Package architecture-matched guest assets
        env:
          VMON_RELEASE_KERNEL: dist/kernel/${{ matrix.kernel }}
        run: ./scripts/package-guest-assets.sh --target ${{ matrix.target }}

      - name: Upload binary and guest artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vmon-${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/vmon-${{ matrix.target }}.tar.gz
            dist/vmon-${{ matrix.target }}.tar.gz.sha256
            dist/vmon-assets-${{ matrix.arch }}.tar.gz
            dist/vmon-assets-${{ matrix.arch }}.tar.gz.sha256

  kernel:
    name: Build ${{ matrix.arch }} guest kernel
    # Native runners: same Ubuntu 24.04 toolchain as `just kernel` (its
    # container on macOS), so local and released kernels are bit-identical.
    # x86_64 builds in a vmon CI sandbox (Ubuntu 24.04, the `ci` template);
    # vmon has no aarch64 nodes, so aarch64 stays on GitHub's arm64 runner.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: vmon-large
            files: bzImage-x86_64 vmlinux-x86_64 config-x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            files: Image-aarch64 config-aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kernel build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential flex bison bc libelf-dev libssl-dev dwarves python3 cpio xz-utils

      - name: Cache kernel source tarball
        uses: actions/cache@v4
        with:
          path: ~/.cache/vmon-kernel/*.tar.gz
          key: kernel-src-${{ hashFiles('kernel/build.sh') }}

      - name: Build kernel
        run: ./kernel/build.sh --arch ${{ matrix.arch }} --out dist/kernel

      - name: Write per-file checksums
        working-directory: dist/kernel
        run: for f in ${{ matrix.files }}; do sha256sum "$f" > "$f.sha256"; done

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vmon-kernel-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/kernel/*-${{ matrix.arch }}
            dist/kernel/*-${{ matrix.arch }}.sha256

  publish:
    name: Publish GitHub release
    # `vmon` is the `ci` template's build size: the sandbox forks its snapshot.
    runs-on: vmon
    needs: [binaries, kernel]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
