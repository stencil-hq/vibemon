name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binaries:
    name: Package ${{ matrix.target }} binaries and guest assets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            arch: aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Zig linker
        uses: goto-bus-stop/setup-zig@v2

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@cargo-zigbuild

      - name: Install target runtime
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-user

      - name: Package release binaries
        run: ./scripts/package-rust-release.sh --target ${{ matrix.target }}

      - name: Smoke archived CLI and validate archived agent
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          smoke_dir=$(mktemp -d)
          trap 'rm -rf "${smoke_dir}"' EXIT
          (
            cd dist
            sha256sum --check "vmon-${RELEASE_TARGET}.tar.gz.sha256"
          )
          tar -xzf "dist/vmon-${RELEASE_TARGET}.tar.gz" -C "${smoke_dir}"
          ./scripts/release-smoke.sh \
            --target "${RELEASE_TARGET}" \
            --vmon "${smoke_dir}/vmon-${RELEASE_TARGET}/vmon" \
            --agent "${smoke_dir}/vmon-${RELEASE_TARGET}/vmon-agent"

      - name: Package architecture-matched guest assets
        run: ./scripts/package-guest-assets.sh --target ${{ matrix.target }}

      - name: Upload binary and guest artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vmon-${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/vmon-${{ matrix.target }}.tar.gz
            dist/vmon-${{ matrix.target }}.tar.gz.sha256
            dist/vmon-assets-${{ matrix.arch }}.tar.gz
            dist/vmon-assets-${{ matrix.arch }}.tar.gz.sha256

  python:
    name: Package Python SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.14'

      - name: Build and validate Python SDK packages
        run: ./scripts/package-python-sdk.sh

      - name: Upload Python SDK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-sdk-package
          if-no-files-found: error
          path: |
            dist/vmon-python-sdk-*.tar.gz
            dist/vmon-python-sdk-*.tar.gz.sha256
            sdk/py/dist/*.whl
            sdk/py/dist/*.tar.gz

  typescript:
    name: Package TypeScript SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install locked TypeScript SDK dependencies
        working-directory: sdk/ts
        run: bun install --frozen-lockfile

      - name: Build and pack TypeScript SDK
        working-directory: sdk/ts
        run: bun run package

      - name: Upload TypeScript SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: typescript-sdk-package
          if-no-files-found: error
          path: sdk/ts/dist/package/stencil-hq-vibemon-*.tgz

  deploy:
    name: Package deployment assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Package self-contained deployment assets
        run: ./scripts/package-release.sh

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deploy-assets
          if-no-files-found: error
          path: |
            dist/vmon-deploy-assets.tar.gz
            dist/SHA256SUMS-deploy.txt

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [binaries, python, typescript, deploy]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
