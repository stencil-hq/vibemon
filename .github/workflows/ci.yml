name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    # vmon CI (docs/src/operate/ci.md) on the `vibemon-ci` template, which
    # bakes the pinned toolchain, the tools below and a pre-built target/
    # (.github/vmon/vibemon_ci_template.py). Pull requests from forks stay on
    # GitHub-hosted runners, which install the tools per run.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'vmon-large/from=vibemon-ci' }}
    env:
      # As Swatinem/rust-cache sets for the integration job; vibemon-ci
      # pre-builds with it, so the workspace crates' fingerprints match.
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Keep vibemon-ci's pre-built target/ (git clean would delete it).
          clean: false

      - name: Install pinned Rust toolchain
        uses: ./.github/actions/rust-toolchain

      - name: Install pinned license tools
        if: runner.environment == 'github-hosted'
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.58.0,cargo-deny@0.20.2

      - name: Check license policy
        run: just license-check

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Install AArch64 cross compiler
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install --yes gcc-aarch64-linux-gnu

      - name: Check
        run: cargo check --workspace --all-targets --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: AArch64 check
        run: cargo check --workspace --all-targets --locked --target aarch64-unknown-linux-gnu

      - name: AArch64 clippy
        run: cargo clippy --workspace --all-targets --locked --target aarch64-unknown-linux-gnu -- -D warnings

      - name: Test
        run: cargo test --locked

      # The musl targets come with the toolchain (rust-toolchain.toml).
      - name: Install Zig linker
        if: runner.environment == 'github-hosted'
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        if: runner.environment == 'github-hosted'
        uses: taiki-e/install-action@cargo-zigbuild

      - name: Build static guest agents
        run: |
          cargo zigbuild --locked --release -p vmon-agent --target x86_64-unknown-linux-musl
          cargo zigbuild --locked --release -p vmon-agent --target aarch64-unknown-linux-musl

      - name: Install cargo-audit
        if: runner.environment == 'github-hosted'
        uses: taiki-e/install-action@cargo-audit

      - name: Audit dependencies
        run: cargo audit

  macos:
    name: macOS aarch64 HVF
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install macOS native dependencies
        run: brew install libslirp pkg-config

      - name: Build
        run: cargo build --locked

      - name: Codesign HVF binary
        run: just codesign

      - name: Compile tests
        run: cargo test --locked --no-run

  windows:
    name: Windows x86_64 WHP
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Install Windows native dependencies
        shell: pwsh
        run: |
          vcpkg install libslirp:x64-windows
          "VCPKG_ROOT=C:\\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKG_DEFAULT_TRIPLET=x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Check vmon binary
        run: cargo check -p vmon --bin vmon --locked

      - name: Lint Windows backend
        run: cargo clippy -p vmm --tests --locked --no-deps -- -A dead_code -D warnings

      - name: Test Windows backend
        run: cargo test -p vmm --lib --locked
