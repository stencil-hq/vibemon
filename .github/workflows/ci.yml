name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: vmon
          MYSQL_DATABASE: vmon
        ports:
          - 13306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pvmon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      VMON_MYSQL_TEST_URL: mysql://root:vmon@127.0.0.1:13306/vmon
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Install pinned license tools
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.58.0,cargo-deny@0.20.2

      - name: Check license policy
        run: just license-check

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Install AArch64 cross compiler
        run: sudo apt-get update && sudo apt-get install --yes gcc-aarch64-linux-gnu

      - name: Check
        run: cargo check --workspace --all-targets --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: AArch64 check
        run: cargo check --workspace --all-targets --locked --target aarch64-unknown-linux-gnu

      - name: AArch64 clippy
        run: cargo clippy --workspace --all-targets --locked --target aarch64-unknown-linux-gnu -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Install musl targets and zig
        run: |
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          pip install ziglang==0.13.0 cargo-zigbuild

      - name: Build static guest agents
        run: |
          cargo zigbuild --locked --release -p vmon-agent --target x86_64-unknown-linux-musl
          cargo zigbuild --locked --release -p vmon-agent --target aarch64-unknown-linux-musl

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Audit dependencies
        run: cargo audit

  macos:
    name: macOS aarch64 HVF
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install macOS native dependencies
        run: brew install libslirp pkg-config

      - name: Build
        run: cargo build --locked

      - name: Codesign HVF binary
        run: just codesign

      - name: Compile tests
        run: cargo test --locked --no-run

  windows:
    name: Windows x86_64 WHP
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Install Windows native dependencies
        shell: pwsh
        run: |
          vcpkg install libslirp:x64-windows
          "VCPKG_ROOT=C:\\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKG_DEFAULT_TRIPLET=x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Check vmon binary
        run: cargo check -p vmon --bin vmon --locked

      - name: Lint Windows backend
        run: cargo clippy -p vmm --tests --locked --no-deps -- -A dead_code -D warnings

      - name: Test Windows backend
        run: cargo test -p vmm --lib --locked
