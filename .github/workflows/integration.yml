name: integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

jobs:
  kvm-integration:
    name: KVM integration
    # vmon-large: 8 vCPUs / 16 GiB with nested KVM (/dev/kvm) for the test
    # VMs. Pull requests from forks stay on GitHub-hosted runners.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'vmon-large' }}
    timeout-minutes: 45
    env:
      VMON_TAP: vmon0
      VMON_HOST_IP: 192.168.249.1
      # Pin the guest kernel to the fetched test asset; otherwise default_kernel()
      # falls back to the runner's own /boot/vmlinuz-*, which is root-only (0600).
      VMON_KERNEL: ${{ github.workspace }}/target/test-assets/bzImage-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare KVM host
        uses: ./.github/actions/kvm-host

      - name: Run Rust gated integration suite
        run: VMON_E2E=1 cargo test --tests -- --test-threads=1
