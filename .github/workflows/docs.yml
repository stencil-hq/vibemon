name: Documentation

on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check documentation
    # vmon CI (docs/src/operate/ci.md); pull requests from forks stay on
    # GitHub-hosted runners.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'vmon' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # 0.5+ renders the `> [!NOTE]` admonitions the pages use.
      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4

      - name: Build documentation
        run: mdbook build docs

      - name: Check local Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress 'docs/**/*.md'

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

  deploy:
    name: Deploy documentation
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    # Only asks the Pages API to deploy the uploaded artifact (no checkout, no
    # build), so it stays on a GitHub-hosted runner.
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
