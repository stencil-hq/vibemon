[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vmon"
dynamic = ["version"]
description = "Thin Python SDK for the Rust vmon API"
readme = "README.md"
license = "MIT OR Apache-2.0"
authors = [
    { name = "Stencil Labs, Inc." },
]
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
requires-python = ">=3.14"

dependencies = [
    "cbor2>=5.7",
    "cloudpickle>=3.1",
    "grpcio>=1.66",
    "httpx>=0.28",
    "protobuf>=7.35.1",
    "zstandard>=0.23",
]

[project.urls]
Homepage = "https://github.com/stencil-hq/vibemon"
Repository = "https://github.com/stencil-hq/vibemon"

[project.optional-dependencies]
test = [
    "pytest",
]

[dependency-groups]
dev = [
    "ruff>=0.15",
    "mypy>=1.13",
    "pytest>=8",
]


[tool.setuptools]
packages = ["vmon", "vmon.v1"]

[tool.setuptools.dynamic]
version = { attr = "vmon.__version__" }

[tool.setuptools.package-data]
vmon = ["py.typed"]
"vmon.v1" = ["*.pyi"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["vmon/v1"]

[tool.ruff.lint]
# pyflakes (F) + pycodestyle (E/W) + isort (I) + pyupgrade (UP) + bugbear (B)
# + comprehensions (C4): a strong, non-pedantic baseline.
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    # `dict(key=value)` reads cleanly as kwargs and is used consistently here;
    # forcing quoted-key literals would be a readability downgrade.
    "C408",
]


[tool.mypy]
python_version = "3.14"
files = ["vmon", "tests/typing_remote.py"]
exclude = ["^e2e\\.py$"]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "vmon.v1.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
