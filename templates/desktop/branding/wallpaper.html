<!doctype html>
<!--
  vibemon desktop wallpaper (files/wallpaper.png, 2048×1536 = the SDK's
  default 4:3 screen at 2×). Brand tokens match the vibemon hero graphics.
  Render: templates/desktop/branding/render.sh
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  :root {
    --bg:        oklch(0.115 0.010 230);
    --bg2:       oklch(0.135 0.011 230);
    --inset:     oklch(0.075 0.007 230);
    --fg:        oklch(0.96 0.004 230);
    --muted:     oklch(0.66 0.010 230);
    --faint:     oklch(0.42 0.012 230);
    --accent:    oklch(0.78 0.135 230);
    --accent-hi: oklch(0.88 0.14 230);
    --accent-dim:oklch(0.56 0.10 230);
    --border:    oklch(0.30 0.014 230 / 0.55);
    --mono: "SF Mono", "JetBrains Mono", "Cascadia Mono", ui-monospace, Menlo, Consolas, monospace;
    --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 2048px; height: 1536px; overflow: hidden; background: var(--inset); }
  body { font-family: var(--sans); -webkit-font-smoothing: antialiased; }

  .canvas {
    position: relative; width: 2048px; height: 1536px; overflow: hidden;
    background:
      radial-gradient(55% 45% at 50% 46%, oklch(0.24 0.07 230 / 0.30) 0%, transparent 70%),
      radial-gradient(70% 60% at 88% 108%, oklch(0.20 0.06 260 / 0.22) 0%, transparent 60%),
      linear-gradient(165deg, var(--bg2) 0%, var(--bg) 48%, var(--inset) 100%);
  }
  /* Dot lattice, strongest around the mark and fading to the edges. */
  .dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(oklch(0.52 0.04 230 / 0.42) 1.6px, transparent 2.4px);
    background-size: 36px 36px; background-position: 18px 18px;
    -webkit-mask-image: radial-gradient(48% 52% at 50% 47%, #000 0%, rgba(0,0,0,0.35) 55%, transparent 100%);
  }
  /* Three hairline "snapshot" frames fanned behind the mark: fork motif. */
  .frame {
    position: absolute; left: 50%; top: 47%; width: 1040px; height: 440px;
    border: 2px solid var(--border); border-radius: 10px;
    background: oklch(0.15 0.012 230 / 0.35);
    transform-origin: 50% 50%;
  }
  .f1 { transform: translate(-50%, -50%) rotate(-5deg) translate(-40px, 30px); opacity: 0.45; }
  .f2 { transform: translate(-50%, -50%) rotate(-2.5deg) translate(-20px, 14px); opacity: 0.75; }
  .f3 { transform: translate(-50%, -50%); opacity: 1;
        border-color: oklch(0.40 0.03 230 / 0.7);
        background: linear-gradient(160deg, oklch(0.17 0.014 230 / 0.75), oklch(0.12 0.010 230 / 0.75));
        box-shadow: 0 40px 120px oklch(0.03 0.015 230 / 0.7), inset 0 2px 0 oklch(0.7 0.03 230 / 0.08); }
  .f3 .bar { position: absolute; top: -1px; left: 56px; width: 280px; height: 3px;
        background: linear-gradient(90deg, var(--accent-hi), var(--accent), transparent); }

  .mark {
    position: absolute; left: 50%; top: 47%; transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center;
  }
  .eyebrow {
    display: flex; align-items: center; gap: 16px;
    font-family: var(--mono); font-size: 22px; letter-spacing: 0.32em; text-transform: uppercase;
    color: var(--accent); font-weight: 500;
  }
  .eyebrow .dim { color: var(--faint); }
  .sq { width: 12px; height: 12px; background: var(--accent); border-radius: 2px;
        box-shadow: 0 0 14px var(--accent); }
  .wordmark {
    margin-top: 22px; font-weight: 800; font-size: 168px; line-height: 0.9;
    letter-spacing: -0.05em; color: var(--fg);
  }
  .wordmark .mon {
    background: linear-gradient(130deg, var(--accent-hi) 0%, var(--accent) 55%, var(--accent-dim) 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .prompt {
    margin-top: 34px; font-family: var(--mono); font-size: 24px; color: var(--muted);
    display: flex; align-items: center; gap: 12px;
  }
  .prompt .p { color: var(--accent); font-weight: 700; }
  .prompt .cur { width: 13px; height: 28px; background: var(--accent); border-radius: 2px;
        box-shadow: 0 0 10px var(--accent); }

  .corner {
    position: absolute; right: 64px; bottom: 56px;
    font-family: var(--mono); font-size: 18px; letter-spacing: 0.08em; color: var(--faint);
  }
  .corner b { color: var(--accent-dim); font-weight: 600; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="dots"></div>
    <div class="frame f1"></div>
    <div class="frame f2"></div>
    <div class="frame f3"><div class="bar"></div></div>
    <div class="mark">
      <div class="eyebrow"><span class="sq"></span>microVM <span class="dim">·</span> desktop</div>
      <div class="wordmark">Vibe<span class="mon">mon</span></div>
      <div class="prompt"><span class="p">$</span> sandbox ready <span class="cur"></span></div>
    </div>
    <div class="corner"><b>vibemon</b> · hardware-isolated sandbox</div>
  </div>
</body>
</html>
