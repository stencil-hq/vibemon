[package]
name = "vmon-cloud"
version = "0.3.2"
edition = "2024"
description = "Cloud workload identity, request signing, and the S3 client for Vibemon"
license.workspace = true
authors.workspace = true
repository.workspace = true


[lints]
workspace = true

[features]
# In-process S3 server for other crates' unit tests (`vmon_cloud::s3::fake`).
fake = ["dep:axum", "tokio/net"]

[dependencies]
axum = { workspace = true, optional = true }
bytes.workspace = true
chrono = "0.4"
futures.workspace = true
hex = "0.4"
hmac = "0.12"
parking_lot.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1.53", features = ["rt", "sync", "time", "macros"] }
url = "2"

[dev-dependencies]
axum.workspace = true
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "macros"] }
