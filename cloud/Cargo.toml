[package]
name = "vmon-cloud"
version = "0.1.0"
edition = "2024"
description = "Cloud workload identity and request signing for Vibemon"
license.workspace = true
authors.workspace = true
repository.workspace = true


[lints]
workspace = true

[dependencies]
chrono = "0.4"
hex = "0.4"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
