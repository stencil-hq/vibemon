[package]
name = "vmon"
version = "0.3.2"
edition = "2024"
description = "Vibemon — KVM/HVF microVM platform with an E2B-compatible control plane"
license = "MIT"
authors = ["Stencil Labs, Inc."]
repository = "https://github.com/stencil-hq/vibemon"

[[bin]]
name = "vmon"
path = "src/main.rs"

[lints]
workspace = true

[workspace.package]
license = "MIT"
authors = ["Stencil Labs, Inc."]
repository = "https://github.com/stencil-hq/vibemon"

[workspace]
members = ["vmm", "agent", "cloud", "cluster", "node", "driver"]
resolver = "3"

[workspace.dependencies]
aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8.9", features = ["ws", "macros"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures = "0.3"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
http = "1"
http-body-util = "0.1.5"
hyper = { version = "1.12", features = ["full"] }
hyper-util = { version = "0.1.21", features = ["full"] }
jsonwebtoken = "9"
libc = "0.2"
openraft = { version = "0.9.25", features = ["serde", "storage-v2"] }
parking_lot = "0.12.5"
percent-encoding = "2"
rand = "0.10"
rcgen = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# No `macros`: on macOS 27, sqlx-macros built with `tls-rustls` produces a proc-macro dylib
# dyld refuses to load ("mis-aligned LINKEDIT string pool"). Migrations are embedded by hand.
sqlx = { version = "0.9", default-features = false, features = ["mysql", "runtime-tokio", "tls-rustls", "migrate", "derive", "chrono", "json", "uuid"] }
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.53", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-util = { version = "0.7", features = ["io", "codec"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
vmon-agent = { path = "agent" }
vmon-cloud = { path = "cloud" }
vmon-cluster = { path = "cluster" }
vmon-driver = { path = "driver" }
vmon-node = { path = "node" }

[workspace.lints.rust]
# ──────────────────────────────────────────────────────────────────────────────
# Rust Lint Levels
# ──────────────────────────────────────────────────────────────────────────────
mismatched_lifetime_syntaxes = "allow"

[workspace.lints.clippy]
# ──────────────────────────────────────────────────────────────────────────────
# Base Lint Levels
# ──────────────────────────────────────────────────────────────────────────────
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "deny", priority = -1 }

# ──────────────────────────────────────────────────────────────────────────────
# Meta: Lint Attributes
# ──────────────────────────────────────────────────────────────────────────────
allow_attributes_without_reason = "warn" # Enforce reason for all #[allow]

# ──────────────────────────────────────────────────────────────────────────────
# Safety & Unsafe Code
# ──────────────────────────────────────────────────────────────────────────────
borrow_as_ptr = "allow"
cast_ptr_alignment = "allow"
ptr_as_ptr = "allow"
ref_as_ptr = "allow"
undocumented_unsafe_blocks = "warn"
unsafe_derive_deserialize = "allow"

# ──────────────────────────────────────────────────────────────────────────────
# Numeric Casts & Conversions
# ──────────────────────────────────────────────────────────────────────────────
cast_lossless = "allow"            # u32 as u64 - 'as' is cleaner than From
cast_possible_truncation = "allow" # u64 as u32 - often intentional
cast_possible_wrap = "allow"       # u32 as i32 - can be intentional
cast_precision_loss = "allow"      # f64 as f32 - sometimes acceptable
cast_sign_loss = "allow"           # i32 as u32 - sometimes needed
tuple_array_conversions = "allow"  # Non-Into conversion is more clear

# ──────────────────────────────────────────────────────────────────────────────
# Floating Point
# ──────────────────────────────────────────────────────────────────────────────
float_cmp = "allow" # Tests mostly do this + we know what we're doing

# ──────────────────────────────────────────────────────────────────────────────
# Functions & Closures
# ──────────────────────────────────────────────────────────────────────────────
inline_always = "allow"                      # Needed for performance-critical code
must_use_candidate = "allow"                 # Not every function needs #[must_use]
needless_pass_by_value = "allow"
redundant_closure_for_method_calls = "allow" # .map(ToString::to_string) can be clearer
return_self_not_must_use = "allow"           # Builder pattern methods

# ──────────────────────────────────────────────────────────────────────────────
# Structs & Types
# ──────────────────────────────────────────────────────────────────────────────
inconsistent_struct_constructor = "allow"
missing_fields_in_debug = "allow"         # Not every field needs to be in Debug output
struct_excessive_bools = "allow"          # Usually with builders

# ──────────────────────────────────────────────────────────────────────────────
# Pattern Matching
# ──────────────────────────────────────────────────────────────────────────────
match_same_arms = "allow"                    # Can be intentional for clarity
match_wildcard_for_single_variants = "allow" # _ can be clearer than listing variants
option_if_let_else = "allow"                 # match/if-let-else often clearer

# ──────────────────────────────────────────────────────────────────────────────
# Imports & Module Organization
# ──────────────────────────────────────────────────────────────────────────────
enum_glob_use = "allow"
items_after_statements = "allow" # Sometimes more readable
wildcard_imports = "allow"       # Cleaner for preludes and test modules

# ──────────────────────────────────────────────────────────────────────────────
# Variables & Type Inference
# ──────────────────────────────────────────────────────────────────────────────
let_underscore_untyped = "allow" # Type obvious from context
similar_names = "allow"          # 'req' and 'res' together are fine

# ──────────────────────────────────────────────────────────────────────────────
# Literals & Formatting
# ──────────────────────────────────────────────────────────────────────────────
unreadable_literal = "allow" # 10_000_000 vs 0xDEADBEEF is context dependent
verbose_bit_mask = "allow"   # Explicit bit patterns can be clearer than hex

# ──────────────────────────────────────────────────────────────────────────────
# Code Style
# ──────────────────────────────────────────────────────────────────────────────
default_trait_access = "allow"        # Default::default() sometimes clearer
significant_drop_tightening = "allow" # We pay attention to this already

# ──────────────────────────────────────────────────────────────────────────────
# Documentation
# ──────────────────────────────────────────────────────────────────────────────
missing_errors_doc = "allow" # Documenting every error return is often redundant
missing_panics_doc = "allow" # Not every panic needs docs, especially assert!

# ──────────────────────────────────────────────────────────────────────────────
# Complexity
# ──────────────────────────────────────────────────────────────────────────────
too_many_arguments = "allow" # Argument count is rarely the real complexity signal
too_many_lines = "allow"     # Arbitrary limits don't account for necessary complexity

[dependencies]
vmm = { path = "vmm" }

[target.'cfg(not(target_os = "windows"))'.dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
hex.workspace = true
libc.workspace = true
rand.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
vmon-cloud.workspace = true
vmon-cluster.workspace = true
vmon-driver.workspace = true
vmon-node.workspace = true

[dev-dependencies]
base64 = "0.22"
flume = { version = "0.11", default-features = false }
libc = "0.2"
reqwest.workspace = true
serde_json = "1"
sqlx.workspace = true
vmon-agent = { path = "agent" }

[patch."https://github.com/insula-rs/libwhp"]
# Vendored to relax its exact `byteorder = "=1.2.1"` pin, which conflicts with sqlx.
libwhp = { path = "vendor/libwhp-0.1.4" }

[patch.crates-io]
vm-memory = { path = "vendor/vm-memory-0.17.1" }
libslirp-sys = { path = "vendor/libslirp-sys-4.2.1" }
libslirp = { path = "vendor/libslirp-4.3.2" }

[profile.release]
opt-level = 2
debug = false
incremental = true
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

# Checkpoint digests hash multi-GiB template dirs even in dev/test runs
# (mesh replication, CAS verify). Debug-built sha2 runs ~40 MB/s and turns
# every replication cycle into minutes; keep the hashing and compression
# crates optimized regardless of profile.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.sha1]
opt-level = 3
[profile.dev.package.digest]
opt-level = 3
[profile.dev.package.block-buffer]
opt-level = 3
[profile.dev.package.crypto-common]
opt-level = 3
[profile.dev.package.generic-array]
opt-level = 3
[profile.dev.package.cpufeatures]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3

